states_and_regions:
  North: ["Delhi", "Haryana", "Punjab", "Himachal Pradesh", "Jammu and Kashmir", "Uttar Pradesh", "Uttarakhand", "Chandigarh"]
  South: ["Karnataka", "Tamil Nadu", "Andhra Pradesh", "Telangana", "Kerala", "Puducherry", "Lakshadweep"]
  West: ["Maharashtra", "Gujarat", "Goa", "Rajasthan", "Dadra and Nagar Haveli and Daman and Diu"]
  East: ["West Bengal", "Bihar", "Jharkhand", "Odisha"]
  Central: ["Madhya Pradesh", "Chhattisgarh"]
  Northeast: ["Assam", "Sikkim", "Arunachal Pradesh", "Meghalaya", "Manipur", "Mizoram", "Nagaland", "Tripura"]

risk_weights:
