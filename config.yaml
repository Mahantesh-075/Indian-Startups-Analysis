# Configuration for Indian Startup Analysis Platform

paths:
  raw_data_dir: "data/raw"
  cleaned_data_dir: "data/cleaned"
  processed_data_dir: "data/processed"
  models_dir: "src/models/weights"
  reports_dir: "reports"
  static_plots_dir: "reports/static_plots"

files:
  funding_raw: "startup_funding.csv"
  gov_raw: "gov-data-final.csv"
  funding_cleaned: "cleaned_funding.csv"
  gov_cleaned: "cleaned_gov.csv"
  processed_features: "processed_features.csv"
  success_model: "success_classifier.joblib"
  funding_model: "funding_regressor.joblib"
  forecast_model: "forecast_arima.joblib"

models:
  random_state: 42
  test_size: 0.2
  n_estimators: 100

nlp:
  vader_lexicon_download: true

